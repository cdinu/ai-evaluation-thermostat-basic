[project]
name = "ai-evaluation-thermostat-basic"
version = "0.1.0"
description = "Learn AI Evaluation with Inspect AI: a hands-on thermostat safety case"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Your Name" },
]
dependencies = [
    "inspect-ai>=0.3.241",
    "openai>=2.44.0",
    "pydantic>=2.13.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
thermostat-eval = "eval.cli:main"

[project.entry-points.inspect_ai]
eval = "eval._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval"]

[tool.hatch.build.targets.wheel.force-include]
data = "data"
